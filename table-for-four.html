<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#4a5a41" />
<title>Table for Four</title>
<style>
  :root{
    --bg:#f6efe4;
    --bg2:#efe5d5;
    --card:#fffaf2;
    --ink:#2b241d;
    --muted:#8a7c68;
    --line:#e4d8c4;
    --line2:#d8c9b0;
    --terra:#c4623f;
    --terra-d:#a94f30;
    --olive:#4a5a41;
    --olive-d:#3a4733;
    --gold:#d9a441;
    --cream:#fffdf8;
    --good:#4a7a4f;
    --warn:#b8863b;
    --bad:#b1533a;
    --shadow:0 12px 34px rgba(74,58,38,.14);
    --shadow-sm:0 4px 14px rgba(74,58,38,.10);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--bg);
    background-image:radial-gradient(1100px 600px at 50% -8%,#fbf5ea 0%,var(--bg) 55%);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--terra-d)}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none !important}
  h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.2px}

  /* ---------- Shell ---------- */
  .wrap{max-width:640px;margin:0 auto;padding:0 18px}
  .console-wrap{max-width:1000px;margin:0 auto;padding:0 18px}

  /* ---------- Buttons ---------- */
  .btn{
    border:none;border-radius:14px;font-size:16px;font-weight:600;
    padding:15px 22px;transition:transform .06s ease,filter .15s ease,background .15s;
    background:var(--terra);color:#fff;box-shadow:var(--shadow-sm);
  }
  .btn:hover{filter:brightness(1.04)}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
  .btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1.5px solid var(--line2)}
  .btn.ghost:hover{background:#fff7ec}
  .btn.olive{background:var(--olive)}
  .btn.sm{padding:9px 15px;font-size:14px;border-radius:11px}
  .btn.block{display:block;width:100%}

  /* ---------- Front door ---------- */
  .door{padding:26px 0 60px}
  .door-top{display:flex;align-items:center;gap:12px;padding:22px 0 8px}
  .mark{
    width:44px;height:44px;border-radius:12px;flex:none;position:relative;
    background:linear-gradient(150deg,var(--terra),var(--terra-d));
    box-shadow:var(--shadow-sm);
  }
  .mark::before,.mark::after{content:"";position:absolute;background:#fff8ee;border-radius:2px}
  .mark::before{width:3px;height:16px;left:14px;top:14px;box-shadow:6px 0 0 #fff8ee,12px 0 0 #fff8ee}
  .mark::after{width:26px;height:3px;left:9px;top:27px;opacity:.9}
  .wordmark{font-family:var(--serif);font-size:19px;font-weight:600}
  .wordmark small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:1px}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:22px;
    box-shadow:var(--shadow);padding:30px 26px;margin-top:18px;
  }
  .hero h1{font-size:33px;line-height:1.14;margin:6px 0 0}
  .hero .lede{color:var(--muted);font-size:16px;line-height:1.55;margin:16px 0 0}
  .hero .pill{display:inline-block;background:#f3e7d3;color:var(--olive-d);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px}
  .hero ul{list-style:none;padding:0;margin:22px 0 0}
  .hero li{display:flex;gap:12px;align-items:flex-start;padding:9px 0;color:var(--ink);font-size:15.5px}
  .hero li b{font-weight:600}
  .tick{flex:none;width:22px;height:22px;border-radius:50%;background:#efe0c8;color:var(--terra-d);display:grid;place-items:center;font-size:13px;font-weight:800;margin-top:1px}

  /* ---------- Steps / form ---------- */
  .progress{display:flex;gap:6px;margin:2px 0 20px}
  .progress i{flex:1;height:6px;border-radius:99px;background:var(--line2);transition:background .2s}
  .progress i.on{background:var(--terra)}
  .step-kicker{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--terra-d)}
  .step h2{font-size:25px;margin:6px 0 4px}
  .step .sub{color:var(--muted);font-size:14.5px;line-height:1.5;margin:0 0 20px}
  .field{margin:0 0 18px}
  .field > label{display:block;font-weight:650;font-size:14.5px;margin:0 0 7px}
  .field .hint{color:var(--muted);font-weight:400;font-size:13px;margin-left:2px}
  input[type=text],input[type=email],input[type=datetime-local],textarea,select{
    width:100%;border:1.5px solid var(--line2);background:#fffdf9;border-radius:12px;
    padding:13px 14px;font-size:16px;font-family:inherit;color:var(--ink);transition:border-color .15s,box-shadow .15s;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--terra);box-shadow:0 0 0 3px rgba(196,98,63,.14)}
  textarea{min-height:104px;resize:vertical;line-height:1.5}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:460px){.two{grid-template-columns:1fr}}

  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{
    border:1.5px solid var(--line2);background:#fffdf9;border-radius:999px;padding:10px 15px;
    font-size:14.5px;font-weight:600;color:var(--ink);transition:all .12s;user-select:none;
  }
  .chip:hover{border-color:var(--terra)}
  .chip.on{background:var(--terra);border-color:var(--terra);color:#fff}
  .chip.olive.on{background:var(--olive);border-color:var(--olive)}

  .slider-row{display:flex;align-items:center;gap:14px;margin-top:4px}
  .slider-row output{font-weight:700;color:var(--terra-d);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;height:8px;border-radius:99px;flex:1;
    background:linear-gradient(90deg,var(--olive),var(--gold),var(--terra));cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--terra);box-shadow:var(--shadow-sm)}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--terra)}
  .scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}

  .nav{display:flex;gap:12px;margin-top:8px}
  .nav .btn{flex:1}
  .nav .btn.ghost{flex:0 0 auto;min-width:96px}

  .review dl{margin:0}
  .review .rrow{padding:12px 0;border-bottom:1px solid var(--line)}
  .review .rrow:last-child{border-bottom:none}
  .review dt{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .review dd{margin:5px 0 0;font-size:15.5px;line-height:1.5;white-space:pre-wrap}

  .done{text-align:center;padding:44px 26px}
  .done .big{width:74px;height:74px;border-radius:50%;background:#e7efdf;color:var(--olive-d);display:grid;place-items:center;margin:0 auto 18px;font-size:36px}
  .done h2{font-size:27px;margin:0 0 8px}
  .done p{color:var(--muted);font-size:16px;line-height:1.55;margin:0 auto;max-width:420px}

  .foot{text-align:center;color:var(--muted);font-size:12.5px;padding:26px 0 30px}
  .foot a{color:var(--muted);text-decoration:underline}

  /* ---------- Console ---------- */
  .cbar{background:var(--olive);color:#fff}
  .cbar-in{max-width:1000px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:14px;justify-content:space-between}
  .cbar .brandc{display:flex;align-items:center;gap:11px;font-family:var(--serif);font-size:17px}
  .cbar .markc{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.14);position:relative}
  .cbar .markc::before{content:"";position:absolute;width:2.5px;height:12px;left:10px;top:10px;background:#fff;box-shadow:5px 0 0 #fff,10px 0 0 #fff;border-radius:2px}
  .cbar .markc::after{content:"";position:absolute;width:20px;height:2.5px;left:6px;top:20px;background:#fff;border-radius:2px;opacity:.85}
  .tabs{display:flex;gap:4px;background:rgba(0,0,0,.12);border-radius:12px;padding:4px}
  .tabs button{background:transparent;border:none;color:#e8efe2;font-weight:650;font-size:14px;padding:8px 15px;border-radius:9px}
  .tabs button.on{background:#fff;color:var(--olive-d)}
  .cbar .who{font-size:12.5px;opacity:.85;display:flex;align-items:center;gap:10px}
  .cbar .who a{color:#fff}

  .panel{margin-top:22px}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
  .panel-head h2{font-size:22px;margin:0}
  .panel-head .count{color:var(--muted);font-size:13.5px}

  table.list{width:100%;border-collapse:collapse;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
  table.list th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:13px 16px;border-bottom:1px solid var(--line);background:#fbf4e8}
  table.list td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
  table.list tr:last-child td{border-bottom:none}
  table.list tbody tr{cursor:pointer;transition:background .1s}
  table.list tbody tr:hover{background:#fbf4e8}
  .cn{font-weight:650}
  .sub2{color:var(--muted);font-size:12.5px}

  .badge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:4px 11px;border-radius:999px;text-transform:capitalize}
  .b-new{background:#e7efdf;color:var(--olive-d)}
  .b-seated{background:#f3e3cf;color:#8a5a24}
  .b-matched{background:#e6ddef;color:#6b4a8a}
  .b-passed{background:#eee3df;color:#8a5a4a}
  .b-proposed{background:#eef1e9;color:var(--olive-d)}
  .b-confirmed{background:#e0ecf3;color:#2f6a8a}
  .b-happened{background:#f3e9d3;color:#8a6a24}
  .b-fizzled{background:#eee1de;color:#9a5040}

  .empty{background:var(--card);border:1px dashed var(--line2);border-radius:18px;padding:44px 26px;text-align:center;color:var(--muted)}
  .empty h3{color:var(--ink);margin:0 0 6px;font-size:19px}

  /* detail drawer */
  .scrim{position:fixed;inset:0;background:rgba(43,36,29,.42);backdrop-filter:blur(2px);z-index:40;display:flex;justify-content:flex-end}
  .drawer{width:min(560px,100%);background:var(--bg);height:100%;overflow-y:auto;box-shadow:-14px 0 40px rgba(0,0,0,.2);animation:slidein .22s ease}
  @keyframes slidein{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
  .drawer-head{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;z-index:2}
  .drawer-head h2{margin:0;font-size:21px}
  .x{border:none;background:#f0e6d5;width:36px;height:36px;border-radius:10px;font-size:18px;color:var(--ink)}
  .drawer-body{padding:22px}
  .kv{margin:0 0 18px}
  .kv .k{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .kv .v{margin-top:4px;font-size:15.5px;line-height:1.55;white-space:pre-wrap}
  .open-answer{background:#fbf4e8;border:1px solid var(--line);border-left:4px solid var(--terra);border-radius:12px;padding:15px 16px;margin:0 0 16px}
  .open-answer .k{color:var(--terra-d)}
  .posture{display:flex;align-items:center;gap:10px;margin-top:6px}
  .posture .bar{flex:1;height:9px;border-radius:99px;background:var(--line2);position:relative;overflow:hidden}
  .posture .bar span{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--olive),var(--terra));border-radius:99px}
  .posture .num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--terra-d);min-width:30px;text-align:right}
  .sect-title{font-family:var(--serif);font-size:15px;color:var(--muted);margin:24px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  .savebar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:14px 22px;display:flex;gap:10px;align-items:center}
  .savebar select{max-width:180px}
  .saved-note{color:var(--good);font-size:13px;font-weight:600;opacity:0;transition:opacity .2s}
  .saved-note.show{opacity:1}

  /* board */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
  @media(max-width:900px){.board{grid-template-columns:1fr 1fr}}
  @media(max-width:560px){.board{grid-template-columns:1fr}}
  .col{background:var(--bg2);border-radius:16px;padding:6px}
  .col > h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 12px;display:flex;justify-content:space-between}
  .tcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;margin:8px 4px;box-shadow:var(--shadow-sm)}
  .tcard .couples{font-weight:650;font-size:15px;line-height:1.4}
  .tcard .plan{color:var(--muted);font-size:13px;margin:7px 0 0;line-height:1.5}
  .tcard .plan b{color:var(--ink);font-weight:600}
  .tcard .tnote{background:#fbf4e8;border-radius:9px;padding:9px 11px;font-size:13px;margin:10px 0 0;line-height:1.5;white-space:pre-wrap}
  .tcard .actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
  .tcard .actions button{font-size:12.5px;padding:7px 11px;border-radius:9px}

  .modal-scrim{position:fixed;inset:0;background:rgba(43,36,29,.42);z-index:50;display:grid;place-items:center;padding:18px}
  .modal{background:var(--bg);border-radius:20px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
  .modal-head{padding:20px 22px 0}
  .modal-head h2{margin:0;font-size:22px}
  .modal-head p{color:var(--muted);font-size:14px;margin:6px 0 0}
  .modal-body{padding:18px 22px 22px}
  .pick{border:1.5px solid var(--line2);border-radius:12px;padding:12px 14px;margin:0 0 9px;display:flex;align-items:center;gap:12px;cursor:pointer;background:#fffdf9;transition:all .12s}
  .pick:hover{border-color:var(--terra)}
  .pick.on{border-color:var(--terra);background:#fdf1e9}
  .pick .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);flex:none;display:grid;place-items:center;color:#fff;font-size:13px}
  .pick.on .box{background:var(--terra);border-color:var(--terra)}
  .pick .pn{font-weight:600;font-size:15px}

  /* login */
  .login-wrap{max-width:420px;margin:0 auto;padding:70px 18px}
  .login-card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:34px 28px;text-align:center}
  .login-card .mark{margin:0 auto 16px}
  .login-card h1{font-size:25px;margin:0 0 6px}
  .login-card p{color:var(--muted);font-size:14.5px;line-height:1.5;margin:0 0 22px}
  .login-card .field{text-align:left}
  .note{font-size:12.5px;color:var(--muted);margin-top:16px;line-height:1.5}
  .link-btn{background:none;border:none;color:var(--terra-d);font-weight:600;text-decoration:underline;font-size:13px;padding:0}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:80;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast"></div>

<script>
/* ============================================================
   Table for Four — concierge build (Steps 1–6 of the brief)
   Self-contained, no build step. Runs on static hosting.

   DATA LAYER
   ----------
   Default: browser localStorage, so the app works out of the box
   and the console has seed data immediately.

   To use the real backend from the brief (Supabase / Postgres),
   paste your project URL + anon key below. When both are set the
   app loads supabase-js from CDN and every read/write goes to your
   `applications` and `tables` tables instead of localStorage.
   RLS from Step 1 still applies: the public front door only needs
   INSERT on applications; the console needs an authenticated admin.
   ============================================================ */
const SUPABASE_URL = "";      // e.g. "https://xxxx.supabase.co"
const SUPABASE_ANON_KEY = "";  // your anon public key
const ADMIN_EMAIL = "draymond@threecitiessocial.com"; // only this email reaches the console

const USE_SUPABASE = !!(SUPABASE_URL && SUPABASE_ANON_KEY);

/* ---------- tiny helpers ---------- */
const $ = (sel, root=document) => root.querySelector(sel);
const el = (html) => { const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; };
const esc = (s) => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'a'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const nowISO = () => new Date().toISOString();
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
function timeAgo(iso){ const s=(Date.now()-new Date(iso).getTime())/1000; if(s<60)return'just now'; if(s<3600)return Math.floor(s/60)+'m ago'; if(s<86400)return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; }

/* ============================================================
   DB — abstracts localStorage vs Supabase behind one interface
   ============================================================ */
const DB = (() => {
  const AKEY='t4_applications', TKEY='t4_tables', SEEDED='t4_seeded_v1';

  // ---- localStorage implementation ----
  const ls = {
    _read(k){ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){ return []; } },
    _write(k,v){ localStorage.setItem(k, JSON.stringify(v)); },
    async listApplications(){ return this._read(AKEY).sort((a,b)=> b.created_at.localeCompare(a.created_at)); },
    async insertApplication(row){ const r={...row,id:uid(),created_at:nowISO(),status:'new'}; const all=this._read(AKEY); all.push(r); this._write(AKEY,all); return r; },
    async updateApplication(id,patch){ const all=this._read(AKEY); const i=all.findIndex(x=>x.id===id); if(i>=0){ all[i]={...all[i],...patch}; this._write(AKEY,all); return all[i]; } },
    async listTables(){ return this._read(TKEY).sort((a,b)=> b.created_at.localeCompare(a.created_at)); },
    async insertTable(row){ const r={...row,id:uid(),created_at:nowISO()}; const all=this._read(TKEY); all.push(r); this._write(TKEY,all); return r; },
    async updateTable(id,patch){ const all=this._read(TKEY); const i=all.findIndex(x=>x.id===id); if(i>=0){ all[i]={...all[i],...patch}; this._write(TKEY,all); return all[i]; } },
    seedIfEmpty(){
      if(localStorage.getItem(SEEDED)) return;
      SEED.forEach((s,i)=>{ const all=this._read(AKEY); all.push({...s,id:uid(),created_at:new Date(Date.now()-(SEED.length-i)*3600e3*7).toISOString()}); this._write(AKEY,all); });
      localStorage.setItem(SEEDED,'1');
    }
  };

  // ---- Supabase implementation ----
  let sb=null;
  const remote = {
    async _client(){ if(sb) return sb; await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js'); sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); return sb; },
    async listApplications(){ const c=await this._client(); const {data,error}=await c.from('applications').select('*').order('created_at',{ascending:false}); if(error)throw error; return data; },
    async insertApplication(row){ const c=await this._client(); const {data,error}=await c.from('applications').insert([row]).select().single(); if(error)throw error; return data; },
    async updateApplication(id,patch){ const c=await this._client(); const {data,error}=await c.from('applications').update(patch).eq('id',id).select().single(); if(error)throw error; return data; },
    async listTables(){ const c=await this._client(); const {data,error}=await c.from('tables').select('*').order('created_at',{ascending:false}); if(error)throw error; return data; },
    async insertTable(row){ const c=await this._client(); const {data,error}=await c.from('tables').insert([row]).select().single(); if(error)throw error; return data; },
    async updateTable(id,patch){ const c=await this._client(); const {data,error}=await c.from('tables').update(patch).eq('id',id).select().single(); if(error)throw error; return data; },
    seedIfEmpty(){ /* seed by hand in Supabase for the real backend */ },
    async magicLink(email){ const c=await this._client(); return c.auth.signInWithOtp({email}); },
    async session(){ const c=await this._client(); const {data}=await c.auth.getSession(); return data.session; }
  };

  return USE_SUPABASE ? remote : ls;
})();

function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }

const STEPS = [
  drawIntro,        // 0
  drawWhoYouAre,    // 1
  drawYourLife,     // 2

  drawThePairOfYou, // 4
  drawOpenQuestions,// 5

const FORM_STEPS = 6; // steps 1..6 show a progress bar

function drawStep(){
  const body = $('#door-body');
  body.innerHTML = '';
  STEPS[intake.step]();
  window.scrollTo({top:0,behavior:'smooth'});
}
function goNext(){ if(intake.step<STEPS.length-1){ intake.step++; drawStep(); } }
function goBack(){ if(intake.step>0){ intake.step--; drawStep(); } }

function progressBar(){
  let s=''; for(let i=1;i<=FORM_STEPS;i++){ s+=`<i class="${i<=intake.step?'on':''}"></i>`; }
  return `<div class="progress">${s}</div>`;
}
function navButtons(nextLabel, canNext=true){
  return `<div class="nav">
    ${intake.step>1?'<button class="btn ghost" data-back>Back</button>':''}
    <button class="btn" data-next ${canNext?'':'disabled'}>${nextLabel||'Continue'}</button>
  </div>`;
}
function wireNav(validate){
  const b=$('#door-body');
  const back=b.querySelector('[data-back]'); if(back) back.onclick=goBack;
  const next=b.querySelector('[data-next]');
  if(next) next.onclick=()=>{ if(!validate||validate()) goNext(); };
}

async function doLogin(){
  const email=$('#l_email').value.trim().toLowerCase();
  const note=$('#l_note');
  if(email!==ADMIN_EMAIL.toLowerCase()){ note.style.color='var(--bad)'; note.textContent='That email isn’t on the admin list.'; return; }

  if(USE_SUPABASE){
    // Real magic-link via Supabase auth
    try{
      note.style.color='var(--muted)'; note.textContent='Sending your link…';
      await DB.magicLink(ADMIN_EMAIL);
      note.textContent='Check your inbox for a sign-in link, then return here.';
    }catch(e){ note.style.color='var(--bad)'; note.textContent='Could not send the link. Check Supabase auth settings.'; }
    return;
  }

  // Local mode: no mail server, so simulate the magic-link click inline.
  const card=$('.login-card');
  card.innerHTML=`
    <div class="mark" style="margin:0 auto 16px"></div>
    <h1>Check your inbox</h1>
    <p>We sent a sign-in link to <b>${esc(ADMIN_EMAIL)}</b>.</p>
    <div style="background:#fbf4e8;border:1px solid var(--line);border-radius:14px;padding:16px;margin:6px 0 4px;text-align:left">
      <div style="font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">📬 Demo inbox</div>
      <div style="font-size:14px;line-height:1.5;color:var(--ink)">Subject: <b>Your Table for Four sign-in link</b><br><span style="color:var(--muted)">This build has no mail server, so tap the link to continue.</span></div>
      <button class="btn block olive" id="l_go" style="margin-top:12px">Tap to sign in →</button>
    </div>
    <div class="note">Only <b>${esc(ADMIN_EMAIL)}</b> can reach the console.</div>`;
  $('#l_go').onclick=()=>{ sessionStorage.setItem(AUTH_KEY,'1'); consoleState.tab='applications'; renderConsole(); };
}

/* ---- Applications list + detail (Step 4) ---- */
function statusBadge(s){ return `<span class="badge b-${esc(s)}">${esc(s)}</span>`; }

function drawApplications(){
  const body=$('#console-body');
  const apps=consoleState.apps;
  body.innerHTML='';
  const head=el(`<div class="panel-head"><h2>Applications</h2><div class="count">${apps.length} total · newest first</div></div>`);
  body.appendChild(head);
  if(!apps.length){
    body.appendChild(el(`<div class="empty"><h3>No applications yet</h3><p>When a couple sends one from the front door, it lands here.</p></div>`));
    return;
  }
  const t=el(`<table class="list"><thead><tr><th>Couple</th><th>Neighborhood</th><th>Applied</th><th>Status</th></tr></thead><tbody></tbody></table>`);
  const tb=t.querySelector('tbody');
  apps.forEach(a=>{
    const tr=el(`<tr data-id="${a.id}">
      <td><div class="cn">${esc(a.couple_name)}</div><div class="sub2">${esc(a.partner1_name)} &amp; ${esc(a.partner2_name)}</div></td>
      <td>${esc(a.neighborhood)||'—'}</td>
      <td class="sub2">${timeAgo(a.created_at)}</td>
      <td>${statusBadge(a.status)}</td>
    </tr>`);
    tr.onclick=()=>openApplication(a.id);
    tb.appendChild(tr);
  });
  body.appendChild(t);
}

function openApplication(id){
  const a=consoleState.apps.find(x=>x.id===id); if(!a) return;
  const arr=(v)=>Array.isArray(v)?v:(v?[v]:[]);
  const posture=(name,v)=>`<div class="kv"><div class="k">${esc(name)}</div><div class="posture"><div class="bar"><span style="width:${v||0}%"></span></div><div class="num">${v||0}</div></div><div class="sub2" style="margin-top:3px">0 reserved · 100 expansive</div></div>`;
  const scrim=el(`<div class="scrim"><div class="drawer">
    <div class="drawer-head"><h2>${esc(a.couple_name)}</h2><button class="x" data-close>×</button></div>
    <div class="drawer-body">
      <div class="kv"><div class="k">Partners</div><div class="v">${esc(a.partner1_name)} &amp; ${esc(a.partner2_name)}</div></div>
      <div class="kv"><div class="k">Neighborhood</div><div class="v">${esc(a.neighborhood)||'—'}</div></div>
      <div class="kv"><div class="k">Household</div><div class="v">${esc(a.kids)||'—'}${arr(a.kid_ages).length?`  ·  ${esc(arr(a.kid_ages).join(', '))}`:''}</div></div>

      <div class="sect-title">What they're hoping for</div>
      <div class="open-answer"><div class="k">A couple they were close with</div><div class="v" style="margin-top:6px">${esc(a.past_couple)||'—'}</div></div>
      <div class="open-answer"><div class="k">Hoping to find</div><div class="v" style="margin-top:6px">${esc(a.hoping_for)||'—'}</div></div>
      <div class="kv"><div class="k">Hard no's</div><div class="v">${esc(a.hard_no)||'—'}</div></div>

      <div class="sect-title">Rhythm</div>
      <div class="kv"><div class="k">Appetite</div><div class="v">${esc(a.hang_appetite)||'—'}</div></div>
      <div class="kv"><div class="k">Free when</div><div class="v">${esc(arr(a.free_slots).join(', '))||'—'}</div></div>
      <div class="kv"><div class="k">Bonds by</div><div class="v" style="text-transform:capitalize">${esc(a.bonds_by)||'—'}</div></div>

      <div class="sect-title">The pair of them</div>
      ${posture(a.partner1_name+"’s posture", a.partner1_posture)}
      ${posture(a.partner2_name+"’s posture", a.partner2_posture)}
      <div class="kv"><div class="k">${esc(a.partner1_name)} is into</div><div class="v">${esc(a.partner1_likes)||'—'}</div></div>
      <div class="kv"><div class="k">${esc(a.partner2_name)} is into</div><div class="v">${esc(a.partner2_likes)||'—'}</div></div>

      <div class="sect-title">Your notes</div>
      <div class="field"><textarea id="d_notes" placeholder="Your read on this couple, who they might pair with, follow-ups…">${esc(a.notes||'')}</textarea></div>
    </div>
    <div class="savebar">
      <label style="font-size:13px;font-weight:650">Status</label>
      <select id="d_status">${APP_STATUSES.map(s=>`<option value="${s}" ${a.status===s?'selected':''}>${s}</option>`).join('')}</select>
      <button class="btn sm" id="d_save">Save</button>
      <span class="saved-note" id="d_saved">Saved ✓</span>
    </div>
  </div></div>`);
  document.body.appendChild(scrim);
  const close=()=>scrim.remove();
  scrim.querySelector('[data-close]').onclick=close;
  scrim.onclick=(e)=>{ if(e.target===scrim) close(); };
  scrim.querySelector('#d_save').onclick=async()=>{
    const patch={ notes:$('#d_notes').value, status:$('#d_status').value };
    await DB.updateApplication(id, patch);
    Object.assign(a, patch);
    const sv=$('#d_saved'); sv.classList.add('show'); setTimeout(()=>sv.classList.remove('show'),1600);
    consoleState.apps = await DB.listApplications();
    drawApplications();
  };
}

/* ---- Seat a table (Step 5) ---- */
function drawSeat(){
  const body=$('#console-body');
  const seatable=consoleState.apps.filter(a=>a.status==='new'||a.status==='seated');
  body.innerHTML='';
  body.appendChild(el(`<div class="panel-head"><h2>Seat a table</h2><div class="count">Pick 2 or 3 couples</div></div>`));
  if(seatable.length<2){
    body.appendChild(el(`<div class="empty"><h3>Not enough couples yet</h3><p>You need at least two applications to seat a table.</p></div>`));
    return;
  }
  const sel=new Set();
  const card=el(`<div class="card" style="max-width:640px">
    <div class="field"><label>Who's at this table? <span class="hint">2 or 3 couples</span></label>
      <div id="seat_picks"></div>
    </div>
    <div class="field"><label>Where?</label><input type="text" id="s_place" placeholder="e.g. Naive in Butchertown, or a picnic at Cherokee Park" /></div>
    <div class="two">
      <div class="field"><label>When?</label><input type="datetime-local" id="s_when" /></div>
      <div class="field"><label>Format</label>
        <div class="chips" id="s_format" style="margin-top:2px">
          <div class="chip on" data-fmt="dinner">Dinner</div>
          <div class="chip" data-fmt="outing">Outing</div>
        </div>
      </div>
    </div>
    <div class="field"><label>Opening note <span class="hint">optional</span></label><textarea id="s_notes" style="min-height:70px" placeholder="Why you're putting these couples together…"></textarea></div>
    <button class="btn block" id="s_save" disabled>Seat this table</button>
  </div>`);
  body.appendChild(card);
  const picks=card.querySelector('#seat_picks');
  seatable.forEach(a=>{
    const p=el(`<div class="pick" data-id="${a.id}"><div class="box">✓</div><div><div class="pn">${esc(a.couple_name)}</div><div class="sub2">${esc(a.neighborhood)||'—'} · ${statusBadgeText(a.status)}</div></div></div>`);
    p.onclick=()=>{
      if(sel.has(a.id)){ sel.delete(a.id); p.classList.remove('on'); }
      else{ if(sel.size>=3){ toast('A table seats at most 3 couples'); return; } sel.add(a.id); p.classList.add('on'); }
      card.querySelector('#s_save').disabled = sel.size<2;
    };
    picks.appendChild(p);
  });
  let fmt='dinner';
  card.querySelectorAll('#s_format .chip').forEach(c=>c.onclick=()=>{ card.querySelectorAll('#s_format .chip').forEach(x=>x.classList.remove('on')); c.classList.add('on'); fmt=c.dataset.fmt; });
  card.querySelector('#s_save').onclick=async()=>{
    const place=card.querySelector('#s_place').value.trim();
    const when=card.querySelector('#s_when').value;
    if(!place){ toast('Where are they meeting?'); return; }
    const ids=[...sel];
    const trow={ couple_ids:ids, place, scheduled_at: when?new Date(when).toISOString():null, format:fmt, status:'proposed', notes:card.querySelector('#s_notes').value.trim() };
    await DB.insertTable(trow);
    for(const id of ids){ await DB.updateApplication(id,{status:'seated'}); }
    toast('Table seated — see the board');
    consoleState.tab='board';
    renderConsole();
  };
}
function statusBadgeText(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* ---- The board (Step 6) ---- */
function drawBoard(){
  const body=$('#console-body');
  const tables=consoleState.tables;
  const nameFor=(id)=>{ const a=consoleState.apps.find(x=>x.id===id); return a?a.couple_name:'(removed)'; };
  body.innerHTML='';
  body.appendChild(el(`<div class="panel-head"><h2>The board</h2><div class="count">${tables.length} table${tables.length===1?'':'s'} · run the cadence by hand</div></div>`));
  if(!tables.length){
    body.appendChild(el(`<div class="empty"><h3>No tables yet</h3><p>Seat one from the “Seat a table” tab and it’ll show up here.</p></div>`));
    return;
  }
  const cols=[['proposed','Proposed'],['confirmed','Confirmed'],['happened','Happened'],['matched','Matched / Fizzled']];
  const board=el(`<div class="board"></div>`);
  cols.forEach(([key,label])=>{
    const inCol = key==='matched'
      ? tables.filter(t=>t.status==='matched'||t.status==='fizzled')
      : tables.filter(t=>t.status===key);
    const col=el(`<div class="col"><h3>${label}<span>${inCol.length}</span></h3></div>`);
    inCol.forEach(t=>col.appendChild(tableCard(t,nameFor)));
    board.appendChild(col);
  });
  body.appendChild(board);
}

function tableCard(t, nameFor){
  const couples=(t.couple_ids||[]).map(nameFor).join('  +  ');
  const idx=TABLE_FLOW.indexOf(t.status);
  const nextStatus = (idx>=0 && idx<TABLE_FLOW.length-1) ? TABLE_FLOW[idx+1] : null;
  const isTerminal = t.status==='matched'||t.status==='fizzled';
  const card=el(`<div class="tcard">
    <div class="couples">${esc(couples)}</div>
    <div class="plan">
      <b>${esc(statusBadgeText(t.format||'dinner'))}</b>${t.place?' · '+esc(t.place):''}<br>
      ${t.scheduled_at?fmtDate(t.scheduled_at):'<span style="opacity:.6">no date set</span>'}
    </div>
    ${t.notes?`<div class="tnote">${esc(t.notes)}</div>`:''}
    <div class="actions"></div>
  </div>`);
  const actions=card.querySelector('.actions');
  if(nextStatus){
    const b=el(`<button class="btn sm">→ ${statusBadgeText(nextStatus)}</button>`);
    b.onclick=()=>advanceTable(t.id, nextStatus);
    actions.appendChild(b);
  }
  if(!isTerminal){
    const f=el(`<button class="btn sm ghost">Fizzled</button>`);
    f.onclick=()=>advanceTable(t.id,'fizzled');
    actions.appendChild(f);
  }
  const n=el(`<button class="btn sm ghost">＋ Note</button>`);
  n.onclick=()=>addTableNote(t);
  actions.appendChild(n);
  return card;
}

async function advanceTable(id, status){
  const t=consoleState.tables.find(x=>x.id===id);
  await DB.updateTable(id,{status});
  // When a table matches, mark its couples matched; if it fizzles, release them back to 'new'
  if(t){
    if(status==='matched'){ for(const cid of (t.couple_ids||[])){ await DB.updateApplication(cid,{status:'matched'}); } }
    if(status==='fizzled'){ for(const cid of (t.couple_ids||[])){ const a=consoleState.apps.find(x=>x.id===cid); if(a&&a.status==='seated') await DB.updateApplication(cid,{status:'new'}); } }
  }
  toast('Moved to '+status);
  await loadConsoleData();
}

function addTableNote(t){
  const scrim=el(`<div class="modal-scrim"><div class="modal">
    <div class="modal-head"><h2>Add a note</h2><p>${esc((t.couple_ids||[]).map(id=>{const a=consoleState.apps.find(x=>x.id===id);return a?a.couple_name:'';}).filter(Boolean).join('  +  '))}</p></div>
    <div class="modal-body">
      <div class="field"><textarea id="m_note" placeholder="What happened, next step, how it felt…">${esc(t.notes||'')}</textarea></div>
      <div class="nav"><button class="btn ghost" data-cancel>Cancel</button><button class="btn" data-save>Save note</button></div>
    </div>
  </div></div>`);
  document.body.appendChild(scrim);
  const close=()=>scrim.remove();
  scrim.querySelector('[data-cancel]').onclick=close;
  scrim.onclick=(e)=>{ if(e.target===scrim) close(); };
  scrim.querySelector('[data-save]').onclick=async()=>{
    await DB.updateTable(t.id,{notes:$('#m_note').value});
    close(); toast('Note saved'); await loadConsoleData();
  };
}

/* ============================================================ */
if(!USE_SUPABASE && DB.seedIfEmpty) DB.seedIfEmpty();
route();
</script>
</body>
</html>
